# Release config for deploynator. Tests stay auto-detected (make test).
# The docs step calls the readmenator console script directly: the default
# `python -m readmenator` resolves to whichever venv is first on PATH.

[docs]
command = "readmenator . --rebuild"
# A full rebuild of this tree takes longer than the 300 s default.
timeout_s = 1200

[pypi]
enabled = false

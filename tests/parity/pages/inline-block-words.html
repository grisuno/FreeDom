<!doctype html>
<html><head><meta charset="utf-8"><title>inline-block words</title>
<style>
body{margin:20px;font:16px/1.5 sans-serif}
h1{font-size:48px;line-height:1.2;text-align:center;margin:0 0 20px}
.line{display:block}
.word{display:inline-block}
p{margin:0 0 16px}
.tag{display:inline-block;padding:2px 8px;background:#dde;border-radius:4px}
.filler{height:900px;background:#f4f4f4}
</style></head><body>
<h1><span class="line"><span class="word">Software</span> <span class="word">still</span> <span class="word">starts</span></span> <span class="line"><span class="word">with</span> <span class="word">you</span></span></h1>
<p><span class="word">Alpha</span> <span class="word">beta</span> <span class="word">gamma</span> plain text <span class="word">delta</span>.</p>
<p><span class="tag">one</span> <span class="tag">two</span> <span class="tag">three</span></p>
<p><span class="word">no</span><span class="word">space</span><span class="word">here</span></p>
<div class="filler"></div>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#ccc;font:16px/40px sans-serif}
.nav{background:#066;height:40px;color:#fff;padding-left:20px}
.nav ul{margin:0;padding:0;display:inline-block}
.nav li{display:inline-block;margin-left:-4px;position:relative}
.nav li:before,.nav li:after{content:"";position:absolute;height:100%;top:0;bottom:0}
.nav li:before{left:0;border-left:1px solid #005c5c}
.nav li:after{right:0;border-right:1px solid #0ff}
.nav li a{padding:0 15px;color:#fff;text-decoration:none}
.nav li a>i{display:none;line-height:inherit;padding:0 8px}
[class^="icon-"]:before,[class*=" icon-"]:before{font-family:"sdicon";font-style:normal;display:inline-block;width:1em;margin-right:.2em;text-align:center}
.icon-book:before{content:'\e8e6'}
.nav li:nth-child(2) span{display:none}
.nav li:nth-child(2) a i{display:inline-block}
.filler{height:1200px}
</style></head><body><div class="nav"><ul><li><a href="#"><i class="icon-book" title="Stories"></i><span>Stories</span></a></li><li><a href="#"><i class="icon-book"></i><span>Polls</span></a></li><li><a href="#">Software</a></li></ul></div><div class="filler"></div></body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<title>clamp-chain probe</title>
<style>
  .autoimage { display: flex; }
  .strlimit { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .autoimage h5.strlimit.card-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-body { display: flex; flex-direction: column; padding: 20px; }
</style></head>
<body>
  <div class="row autoimage">
    <div class="mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="strlimit card-title">This is a very long anime title that wraps onto many many lines of text and keeps going</h5>
        </div>
      </div>
    </div>
  </div>
</body></html>

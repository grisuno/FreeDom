<!doctype html>
<html><head><meta charset="utf-8">
<title>jkanime-tile probe</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .row { display: flex; flex-wrap: wrap; }
  .card { position: relative; display: flex; flex-direction: column; min-width: 0;
          word-wrap: break-word; background: #fff; border: 1px solid #ddd; }
  .card-body { flex: 1 1 auto; min-height: 1px; padding: 1.25rem;
               display: flex; flex-direction: column; }
  .card-title { margin-bottom: .75rem; font-size: 16px; }
  .strlimit { display: -webkit-box; -webkit-line-clamp: 3;
              -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 12px; margin-top: 6px; }
</style></head>
<body>
  <div class="row">
    <div class="card">
      <div class="card-body">
        <img class="card-img-top" alt="Shingeki no Kyojin The Final Season Part 2" width="200" height="280">
        <div class="strlimit card-title">Shingeki no Kyojin The Final Season Part 2 Shingeki no Kyojin The Final Season Part 2</div>
        <span class="badge">TV · 24 min</span>
      </div>
    </div>
  </div>
</body></html>

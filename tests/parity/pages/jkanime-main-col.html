<!doctype html>
<html><head><meta charset="utf-8">
<title>jkanime-main-col probe</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .container { width: 100%; padding-right: 15px; padding-left: 15px;
               margin-right: auto; margin-left: auto; }
  .row { display: -ms-flexbox; display: flex; -ms-flex-wrap: wrap;
         flex-wrap: wrap; margin-right: -15px; margin-left: -15px; }
  .col-lg-9 { position: relative; width: 100%; padding-right: 15px;
              padding-left: 15px; -ms-flex: 0 0 75%; flex: 0 0 75%; max-width: 75%; }
  .col-lg-3 { position: relative; width: 100%; padding-right: 15px;
              padding-left: 15px; -ms-flex: 0 0 25%; flex: 0 0 25%; max-width: 25%; }
  .main-box { background: #eef; height: 200px; }
  .rail-box { background: #fee; height: 200px; }
</style></head>
<body>
  <div class="container">
    <div class="row">
      <div class="col-lg-9"><div class="main-box"></div></div>
      <div class="col-lg-3"><div class="rail-box"></div></div>
    </div>
  </div>
</body></html>

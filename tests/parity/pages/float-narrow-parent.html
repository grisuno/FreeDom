<!doctype html><html><head><meta charset="utf-8"><title>float in a narrow parent</title><style>
body{margin:20px;font:16px sans-serif;color:#111}
.w{width:600px;border:1px solid #bbb;margin-bottom:16px}
.m{max-width:500px;background:#eef}
.f{float:right;border:1px solid #555;background:#fda;padding:4px 12px}
.l{float:left;border:1px solid #555;background:#adf;padding:4px 12px}
.cap{float:right;max-width:28em;background:#dfd;border:1px solid #585;padding:2px 6px}
.fx{float:right;display:flex;gap:6px;align-items:center;border:1px solid #555;background:#fcf;padding:4px}
.ic{display:inline-block;width:20px;height:20px;background:#404244}
.row{display:flex;align-items:center;gap:12px}
.grow{flex-grow:1;background:#f4f4f4}
.clear{clear:both}
</style></head><body>
<div class="w"><div class="f">derecha</div>texto que acompaña al flotante dentro de un padre de 600 px.<div class="clear"></div></div>
<div class="w m"><div class="l">izquierda</div>texto junto al flotante izquierdo.<div class="clear"></div></div>
<div class="w"><div class="cap">tope max-width</div>el flotante solo tiene max-width.<div class="clear"></div></div>
<div class="w"><div class="fx"><span class="ic"></span><span>flex flotante</span></div><div class="clear"></div></div>
<div class="w row"><div class="grow"><a class="fx" href="#"><span class="ic"></span></a></div><span>fin de fila</span></div>
<p>despues</p>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<title>jkanime-clamp probe</title>
<style>
  body { margin: 0; font-family: sans-serif; font-size: 16px; }
  .card { width: 220px; background: #fff; border: 1px solid #ddd; padding: 10px; }
  .card-title { margin-bottom: .75rem; font-size: 16px; }
  .strlimit { display: -webkit-box; -webkit-line-clamp: 3;
              -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
</style></head>
<body>
  <div class="card">
    <div class="strlimit card-title">Shingeki no Kyojin The Final Season Part 2 is a long anime title that definitely wraps onto several lines of text</div>
  </div>
</body></html>

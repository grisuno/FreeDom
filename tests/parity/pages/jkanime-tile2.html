<!doctype html>
<html><head><meta charset="utf-8">
<title>jkanime-tile2 probe</title>
<style>
  body { margin: 0; font-family: sans-serif; font-size: 16px; }
  .row { display: flex; flex-wrap: wrap; }
  .card { position: relative; display: flex; flex-direction: column; min-width: 0;
          word-wrap: break-word; background: #fff; border: 1px solid #ddd; margin: 10px; }
  .card-img-top { flex-shrink: 0; width: 100%; }
  .d-thumb { height: 100%; position: relative; }
  .badges-top { position: absolute; right: 5px; top: 10px; }
  .badge { font-size: 12px; }
  .card-body { flex: 1 1 auto; min-height: 1px; padding: 1.25rem; }
  .card-title { margin-bottom: .75rem; font-size: 16px; }
  .strlimit { display: -webkit-box; -webkit-line-clamp: 3;
              -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
</style></head>
<body>
  <div class="row">
    <div class="card">
      <a href="#">
        <div class="d-thumb">
          <img class="card-img-top" src="https://cdn.jkdesa.com/x.jpg"
               alt="Azur Lane: Bisoku Zenshin! Ni!! - 2">
          <div class="badges badges-top"><span class="badge">Ep 2</span></div>
        </div>
        <div class="card-body">
          <h5 class="strlimit card-title">Azur Lane: Bisoku Zenshin! Ni!!</h5>
        </div>
      </a>
    </div>
  </div>
</body></html>

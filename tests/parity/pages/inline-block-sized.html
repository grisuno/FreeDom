<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:10px;font:18px sans-serif}
p{margin:8px 0}
.box{display:inline-block;width:48px;height:36px;background:#1f883d}
.badge{display:inline-block;width:110px;height:30px;background:#ddf4ff;border:1px solid #0969da}
.dot{display:inline-block;width:12px;height:12px;background:#d1242f;border-radius:6px}
.pill{display:inline-block;padding:2px 10px;background:#fff8c5;border:1px solid #d4a72c;border-radius:12px}
.tall{height:1100px}
</style></head><body>
<p>an empty sized atom <span class="box"></span> keeps its space and grows the line</p>
<p>a sized badge <span class="badge">label</span> holds its text on the same line</p>
<p>a status dot <span class="dot"></span> sits on the baseline</p>
<p>and a padded pill <span class="pill">v1.2.3</span> flows with the sentence</p>
<p><span class="dot"></span> <span class="dot"></span> <span class="dot"></span> three dots in a row</p>
<div class="tall"></div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:10px;font:24px sans-serif}
p{margin:6px 0;text-decoration:underline}
.a{text-underline-offset:0}.b{text-underline-offset:4px}.c{text-underline-offset:10px}
.d{text-underline-offset:-2px}.e{text-underline-offset:0.3em}.f{text-underline-offset:auto}
.g{text-underline-offset:6px;text-decoration-thickness:3px}
.tall{height:1100px}
</style></head><body>
<p>default underline</p><p class="a">offset 0</p><p class="b">offset 4px</p><p class="c">offset 10px</p>
<p class="d">offset -2px</p><p class="e">offset 0.3em</p><p class="f">offset auto</p><p class="g">offset 6px thick 3px</p>
<div class="tall"></div></body></html>
